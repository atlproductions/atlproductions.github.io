<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATL Productions - Privacy Policies</title>
    <link rel="icon" type="image/png" href="atl_productions_logo.png">
    <style>
      body {
        background-color: #595959;
        color: white;
        font-family: 'Arial', sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        line-height: 1.6;
      }

      .company {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        margin-bottom: 20px;
      }

      h1 {
        font-size: 2.5em;
        margin: 0 0 30px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
      }

      .apps {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
      }

      .app {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 220px;
        padding: 25px 15px;
        border-radius: 16px;
        background-color: rgba(0, 0, 0, 0.2);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        color: white;
        text-decoration: none;
        font-weight: bold;
        font-size: 1.2em;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
      }

      .app:hover {
        color: #ffcc00;
        background-color: rgba(0, 0, 0, 0.3);
      }

      .app img {
        width: 120px;
        height: 120px;
        margin-bottom: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      .app .round { border-radius: 50%; }
      .app .rounded { border-radius: 24%; }

      .app span {
        font-weight: normal;
        font-size: 0.8em;
        opacity: 0.85;
      }

      @media (max-width: 600px) {
        h1 { font-size: 2em; }
      }
    </style>
  </head>
  <body>
    <img src="atl_productions_logo.png" alt="ATL Productions Logo" class="company">
    <h1>Privacy Policies</h1>
    <div class="apps">
      <a class="app" href="ghost-notes/">
        <img src="ghost-notes/icon.png" alt="Ghost Notes Logo" class="round">
        Ghost Notes
        <span>Privacy Policy</span>
      </a>
      <a class="app" href="elements-slash/">
        <img src="elements-slash/icon.png" alt="Elements Slash Logo" class="rounded">
        Elements Slash
        <span>Privacy Policy</span>
      </a>
    </div>
  </body>
</html>
